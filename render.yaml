services:
  - type: web
    name: workout-tracker
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    rootDir: workout-tracker
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: WORKOUT_TRACKER_STORAGE_SECRET
        generateValue: true
      - key: WORKOUT_TRACKER_DATABASE_PATH
        value: /var/data/workout_tracker.db
    disk:
      name: workout-data
      mountPath: /var/data
      sizeGB: 1
