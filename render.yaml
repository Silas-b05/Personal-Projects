services:
  - type: web
    name: workout-tracker
    runtime: python
    plan: free
    region: frankfurt
    rootDir: workout-tracker
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: WORKOUT_TRACKER_STORAGE_SECRET
        generateValue: true
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
